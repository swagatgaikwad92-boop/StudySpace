<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f0" />
  <meta name="description" content="Study Space — a calm digital study desk" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Study Space" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <title>Study Space</title>

  <!-- Critical CSS: page remains usable even if external sheets fail -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:#f7f5f0;color:#2c2a26;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none}
    html{position:fixed;width:100%;height:100%}
    .skip-link{position:absolute;top:-100%;left:16px;z-index:9999;padding:8px 16px;background:#3d5a4c;color:#fff;border-radius:8px;font-size:14px;text-decoration:none}
    .skip-link:focus{top:16px}

    #workspace{position:fixed;inset:0;overflow:hidden;background:#f7f5f0}

    /* Canvas + visible dotted desk */
    #canvas-container{
      position:absolute;inset:0;overflow:hidden;cursor:grab;
      background-color:#f7f5f0;
      background-image:radial-gradient(circle,rgba(44,42,38,.11) 1px,transparent 1px);
      background-size:28px 28px;
      background-position:0 0;
    }
    #canvas-container.is-panning{cursor:grabbing}
    #canvas-world{position:absolute;top:0;left:0;width:1px;height:1px;transform-origin:0 0;will-change:transform}
    #canvas-grid{display:none} /* grid now on container so it always shows */
    #grid-wave{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:1}
    #objects-layer{position:absolute;top:0;left:0;width:8000px;height:8000px;z-index:10}
    #drawing-layer{position:absolute;top:0;left:0;width:8000px;height:8000px;z-index:15;pointer-events:none}
    #drawing-layer.active{pointer-events:auto;cursor:crosshair}

    /* Empty state — quiet, no competing chrome */
    #empty-state{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:5;transition:opacity .35s ease}
    #empty-state.hidden{opacity:0;visibility:hidden}
    #empty-state .empty-message{font-size:15px;color:#a39e96;font-weight:400;letter-spacing:.03em}
    #empty-state .empty-actions{display:none} /* floating buttons are the real actions */

    /* Floating glass controls */
    .floating-btn{
      position:fixed;z-index:300;width:48px;height:48px;border-radius:9999px;border:1px solid rgba(44,42,38,.06);
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      background:rgba(255,255,255,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      box-shadow:0 4px 20px rgba(44,42,38,.07),0 1px 3px rgba(44,42,38,.04);
      color:#2c2a26;-webkit-tap-highlight-color:transparent;
      transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
    }
    .floating-btn:active{transform:scale(.94)}
    .floating-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
    #add-btn{bottom:max(24px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
    #add-btn:active{transform:translateX(-50%) scale(.94)}
    #tools-btn{bottom:max(24px,env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px))}

    /* Popup menus */
    .popup-menu{
      position:fixed;z-index:400;min-width:190px;padding:8px;
      background:rgba(255,255,255,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      border:1px solid rgba(44,42,38,.07);border-radius:16px;
      box-shadow:0 10px 40px rgba(44,42,38,.1),0 2px 8px rgba(44,42,38,.04);
      opacity:0;visibility:hidden;pointer-events:none;
      transform:scale(.96) translateY(6px);
      transition:opacity .16s ease,transform .16s ease,visibility .16s;
    }
    .popup-menu.open{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1) translateY(0)}
    .popup-menu-item{
      display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:none;background:transparent;
      border-radius:10px;font-size:14px;color:#2c2a26;cursor:pointer;text-align:left;font-family:inherit;font-weight:450;
    }
    .popup-menu-item:hover,.popup-menu-item:active{background:rgba(0,0,0,.045)}
    .popup-menu-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0;stroke-linecap:round;stroke-linejoin:round}
    .popup-menu-divider{height:1px;background:rgba(44,42,38,.07);margin:5px 10px}

    #pen-toolbar{
      position:fixed;bottom:88px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;
      padding:10px 14px;z-index:300;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);
      border-radius:16px;box-shadow:0 6px 28px rgba(44,42,38,.08);border:1px solid rgba(44,42,38,.07)
    }
    #pen-toolbar.visible{display:flex}
    #focus-overlay{position:fixed;inset:0;background:rgba(247,245,240,.55);z-index:9;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s}
    #focus-overlay.active{opacity:1;visibility:visible;pointer-events:auto}
    #context-menu{position:fixed;z-index:400}
    #toast-container{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{padding:12px 18px;font-size:13px;color:#2c2a26;border-radius:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);box-shadow:0 4px 20px rgba(44,42,38,.08);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
    .toast.show{opacity:1;transform:translateY(0)}

    input[type="file"],.file-input-hidden{position:absolute!important;width:0!important;height:0!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;border:0!important}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 14px;border:none;border-radius:10px;
      background:rgba(255,255,255,.55);backdrop-filter:blur(12px);color:#2c2a26;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;
      box-shadow:0 2px 12px rgba(44,42,38,.04);border:1px solid rgba(44,42,38,.06)
    }
    .btn:hover{background:rgba(255,255,255,.75)}
    .btn-primary{background:#3d5a4c;color:#fff;border-color:transparent}
    .btn-primary:hover{background:#2f4639}
    .btn-ghost{background:transparent;box-shadow:none}
  </style>

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/glass.css" />
  <link rel="stylesheet" href="styles/canvas.css" />
  <link rel="stylesheet" href="styles/windows.css" />
  <link rel="stylesheet" href="styles/controls.css" />
  <link rel="stylesheet" href="styles/tools.css" />
  <link rel="stylesheet" href="styles/pomodoro.css" />
  <link rel="stylesheet" href="styles/dabsy.css" />
  <link rel="stylesheet" href="styles/animations.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="stylesheet" href="styles/accessibility.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
</head>
<body>
  <a href="#workspace" class="skip-link">Skip to workspace</a>

  <div id="workspace" role="application" aria-label="Study Space workspace">
    <div id="canvas-container">
      <div id="canvas-world">
        <div id="canvas-grid" aria-hidden="true"></div>
        <div id="grid-wave" aria-hidden="true"></div>
        <div id="objects-layer"></div>
        <div id="drawing-layer">
          <canvas id="drawing-canvas"></canvas>
        </div>
      </div>
    </div>

    <div id="empty-state">
      <p class="empty-message">Your desk is ready.</p>
    </div>

    <button type="button" id="add-btn" class="floating-btn" aria-label="Add content" title="Add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <button type="button" id="tools-btn" class="floating-btn" aria-label="Tools" title="Tools">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </button>

    <div id="add-menu" class="popup-menu" role="menu" aria-label="Add content" hidden>
      <button type="button" class="popup-menu-item" data-action="add-pdf" role="menuitem">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        PDF
      </button>
      <button type="button" class="popup-menu-item" data-action="add-video" role="menuitem">
        <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        Video
      </button>
      <button type="button" class="popup-menu-item" data-action="add-image" role="menuitem">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Image
      </button>
      <button type="button" class="popup-menu-item" data-action="add-text" role="menuitem">
        <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        Text
      </button>
      <div class="popup-menu-divider"></div>
      <button type="button" class="popup-menu-item" data-action="add-file" role="menuitem">
        <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        File
      </button>
      <button type="button" class="popup-menu-item" data-action="add-camera" role="menuitem">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Camera
      </button>
    </div>

    <div id="tools-menu" class="popup-menu" role="menu" aria-label="Tools" hidden>
      <button type="button" class="popup-menu-item" data-action="tool-sticky" role="menuitem">
        <svg viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8z"/><polyline points="15 3 15 9 21 9"/></svg>
        Sticky Note
      </button>
      <button type="button" class="popup-menu-item" data-action="tool-pen" role="menuitem">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        Pen
      </button>
      <button type="button" class="popup-menu-item" data-action="tool-focus" role="menuitem">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        Focus
      </button>
      <button type="button" class="popup-menu-item" data-action="tool-calculator" role="menuitem">
        <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/></svg>
        Calculator
      </button>
      <div class="popup-menu-divider"></div>
      <button type="button" class="popup-menu-item" data-action="tool-pomodoro" role="menuitem">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Pomodoro
      </button>
      <button type="button" class="popup-menu-item" data-action="tool-dabsy" role="menuitem">
        <svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 3.5 2.5 6.5 6 7.5V21h4v-3.5c3.5-1 6-4 6-7.5a8 8 0 0 0-8-8z"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg>
        DABSy
      </button>
    </div>

    <div id="pen-toolbar" role="toolbar" aria-label="Pen tools">
      <button type="button" class="btn" data-pen-action="undo" title="Undo" aria-label="Undo" style="width:32px;height:32px;padding:0">↶</button>
      <button type="button" class="btn" data-pen-action="redo" title="Redo" aria-label="Redo" style="width:32px;height:32px;padding:0">↷</button>
      <button type="button" class="pen-size-btn active" data-size="2" aria-label="Thin" style="width:10px;height:10px;border-radius:50%;border:2px solid transparent;background:#2c2a26;padding:0;cursor:pointer"></button>
      <button type="button" class="pen-size-btn" data-size="4" aria-label="Medium" style="width:16px;height:16px;border-radius:50%;border:2px solid transparent;background:#2c2a26;padding:0;cursor:pointer"></button>
      <button type="button" class="pen-size-btn" data-size="8" aria-label="Thick" style="width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:#2c2a26;padding:0;cursor:pointer"></button>
      <button type="button" class="pen-color-btn active" data-color="#2c2a26" style="width:22px;height:22px;border-radius:50%;background:#2c2a26;border:2px solid #3d5a4c;padding:0;cursor:pointer" aria-label="Black"></button>
      <button type="button" class="pen-color-btn" data-color="#3d5a4c" style="width:22px;height:22px;border-radius:50%;background:#3d5a4c;border:2px solid transparent;padding:0;cursor:pointer" aria-label="Green"></button>
      <button type="button" class="pen-color-btn" data-color="#b54a3c" style="width:22px;height:22px;border-radius:50%;background:#b54a3c;border:2px solid transparent;padding:0;cursor:pointer" aria-label="Red"></button>
      <button type="button" class="pen-color-btn" data-color="#3b6ea5" style="width:22px;height:22px;border-radius:50%;background:#3b6ea5;border:2px solid transparent;padding:0;cursor:pointer" aria-label="Blue"></button>
      <button type="button" class="btn" data-pen-action="erase" title="Eraser" aria-label="Eraser" style="width:32px;height:32px;padding:0;font-size:12px">Er</button>
      <button type="button" class="btn" data-pen-action="clear" title="Clear" aria-label="Clear" style="width:32px;height:32px;padding:0;font-size:12px">Clr</button>
      <button type="button" class="btn" data-pen-action="done" title="Done" aria-label="Done" style="width:32px;height:32px;padding:0">✓</button>
    </div>

    <div id="focus-overlay" aria-hidden="true"></div>
    <div id="context-menu" class="popup-menu" role="menu" hidden></div>
    <div id="toast-container" aria-live="polite"></div>

    <input type="file" id="file-pdf" accept="application/pdf,.pdf" class="file-input-hidden" tabindex="-1" aria-hidden="true" />
    <input type="file" id="file-image" accept="image/*" class="file-input-hidden" tabindex="-1" aria-hidden="true" />
    <input type="file" id="file-any" accept="*/*" class="file-input-hidden" tabindex="-1" aria-hidden="true" />
    <input type="file" id="file-camera" accept="image/*" capture="environment" class="file-input-hidden" tabindex="-1" aria-hidden="true" />
  </div>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
